# PCG script ownership, testing, deployment, and repair policy.
# Scripts not listed here default to detect-only and the local box owner.

[[script]]
name = "pcg-automation-health.py"
owner_email = "wes@procoffeegear.com"
source_repo = "https://github.com/Pro-Coffee-Gear/pcg-agents"
repair_policy = "critical-approval"
test_command = "python3 -m unittest tests/test_automation_core.py -v"
deployment_method = "Fleet sync from pcg-agents/scripts"
rollback_method = "Revert the GitHub commit; fleet sync restores the previous version"
alert_target = "wes@procoffeegear.com"

